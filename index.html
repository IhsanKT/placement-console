<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Placement Console</title>
<meta name="description" content="Personal tracker for upcoming placement tests.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='7' fill='none' stroke='%2316171a' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%235d7a63'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f4f4f0;
    --surface: #ffffff;
    --surface-2: #fafaf7;
    --line: #e4e4de;
    --line-strong: #cfcfc7;
    --ink: #16171a;
    --ink-2: #4a4c50;
    --muted: #8a8c8f;
    --accent: #5d7a63;        /* sage – upcoming */
    --accent-soft: #e8efe8;
    --today: #b8683f;         /* clay – today */
    --today-soft: #f6ebe3;
    --live: #3f7d86;          /* mineral teal – in progress */
    --live-soft: #e2eff0;
    --done: #a3a5a8;
    --done-soft: #efefec;
    --danger: #b04a42;
    --radius: 14px;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: "Space Grotesk", system-ui, -apple-system, Segoe UI, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background-color: var(--bg);
    background-image: radial-gradient(circle at 1px 1px, #d9d9d2 1px, transparent 0);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px 80px; }

  /* ---------- top bar ---------- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 22px 0; border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 34px; height: 34px; border: 2px solid var(--ink); border-radius: 10px;
    display: grid; place-items: center;
  }
  .brand-mark span { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.6); opacity: .55; } }
  .brand h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  .brand small { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--muted); letter-spacing: .14em; text-transform: uppercase; }
  .top-right { display: flex; align-items: center; gap: 18px; }
  .sync-pill {
    display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface);
    border-radius: 999px; padding: 6px 13px 6px 11px; font-family: var(--mono); font-size: 11.5px; color: var(--ink-2);
    cursor: pointer; white-space: nowrap; transition: border-color .12s;
  }
  .sync-pill:hover { border-color: var(--line-strong); color: var(--ink); }
  .sync-pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--done); }
  .sync-pill.ok i { background: var(--accent); }
  .sync-pill.busy i { background: var(--live); animation: pulse 1s ease-in-out infinite; }
  .sync-pill.warn i { background: var(--today); }
  .sync-pill.bad i { background: var(--danger); }
  .clock { font-family: var(--mono); text-align: right; font-size: 12px; color: var(--ink-2); }
  .clock b { display: block; font-size: 18px; font-weight: 500; color: var(--ink); letter-spacing: .02em; }

  .label {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
  }

  /* ---------- hero / next test ---------- */
  .hero {
    margin-top: 28px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
    padding: 28px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 28px; position: relative; overflow: hidden;
  }
  .hero::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(90deg, transparent 0, transparent calc(100% - 1px), var(--line) 0) 0 0 / 40px 100%;
    opacity: .35; mask-image: linear-gradient(to left, #000, transparent 60%);
  }
  .hero > * { position: relative; z-index: 1; }
  .hero-company { font-size: clamp(28px, 5vw, 44px); font-weight: 600; letter-spacing: -.025em; line-height: 1.05; margin: 10px 0 6px; word-break: break-word; }
  .hero-test { color: var(--ink-2); font-size: 16px; }
  .hero-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .chip {
    font-family: var(--mono); font-size: 11.5px; padding: 5px 10px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2); white-space: nowrap;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis;
  }
  .hero > *, .row, .row > * { min-width: 0; }
  .countdown { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; align-self: center; }
  .cd-cell { border: 1px solid var(--line); border-radius: 12px; padding: 14px 8px 10px; text-align: center; background: var(--surface-2); }
  .cd-cell b { display: block; font-family: var(--mono); font-size: clamp(24px, 4vw, 34px); font-weight: 500; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .cd-cell span { font-family: var(--mono); font-size: 10px; letter-spacing: .16em; color: var(--muted); text-transform: uppercase; }
  .hero-empty { grid-column: 1 / -1; text-align: center; padding: 20px 0; }
  .hero-empty p { margin: 8px 0 18px; color: var(--ink-2); }

  /* ---------- stats ---------- */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 14px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .stat b { display: block; font-family: var(--mono); font-size: 26px; font-weight: 500; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .stat i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }

  /* ---------- toolbar ---------- */
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 32px 0 14px; }
  .seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
  .seg button {
    border: 0; background: transparent; padding: 7px 13px; border-radius: 9px; cursor: pointer;
    font-family: var(--mono); font-size: 12px; color: var(--ink-2); letter-spacing: .02em;
  }
  .seg button.on { background: var(--ink); color: #fff; }
  .seg button .n { opacity: .6; margin-left: 5px; }
  .search {
    flex: 1; min-width: 180px; display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px;
  }
  .search input { border: 0; outline: 0; background: transparent; padding: 9px 0; width: 100%; font-size: 14px; }
  .search:focus-within { border-color: var(--line-strong); }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--ink); background: var(--ink); color: #fff;
    padding: 9px 16px; border-radius: 12px; cursor: pointer; font-weight: 500; font-size: 14px; transition: transform .12s ease, opacity .12s;
  }
  .btn:hover { opacity: .88; }
  .btn:active { transform: scale(.98); }
  .btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
  .btn.ghost:hover { border-color: var(--line-strong); opacity: 1; }
  .btn.danger { background: var(--danger); border-color: var(--danger); }
  .btn.sm { padding: 6px 11px; font-size: 13px; border-radius: 10px; }

  /* ---------- list ---------- */
  .group-label { margin: 26px 0 10px; display: flex; align-items: center; gap: 10px; }
  .group-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .list { display: grid; gap: 10px; }
  .row {
    display: grid; grid-template-columns: 74px 1fr auto; gap: 18px; align-items: center;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px 14px 14px;
    position: relative; transition: border-color .15s, box-shadow .15s; animation: rise .35s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .row:hover { border-color: var(--line-strong); box-shadow: 0 6px 20px -14px rgba(22,23,26,.35); }
  .row::before { content: ""; position: absolute; left: -1px; top: 14px; bottom: 14px; width: 3px; border-radius: 0 3px 3px 0; background: var(--st); }
  .date-block { text-align: center; border-right: 1px dashed var(--line); padding-right: 14px; }
  .date-block .d { font-family: var(--mono); font-size: 26px; font-weight: 500; line-height: 1; }
  .date-block .m { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); margin-top: 4px; }
  .date-block .w { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .info { min-width: 0; }
  .info .co { font-weight: 600; font-size: 17px; letter-spacing: -.01em; }
  .info .tt { color: var(--ink-2); font-size: 14px; }
  .info .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .info .notes { margin-top: 8px; color: var(--ink-2); font-size: 13.5px; white-space: pre-wrap; word-break: break-word; }
  .info a, .hero a { color: var(--live); text-decoration: none; border-bottom: 1px solid currentColor; }
  .side { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .status {
    font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    padding: 4px 10px; border-radius: 999px; background: var(--st-soft); color: var(--st); white-space: nowrap;
  }
  .status .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-right: 6px; vertical-align: 1px; }
  .row.live .status .dot, .row.today .status .dot { animation: pulse 1.6s ease-in-out infinite; }
  .eta { font-family: var(--mono); font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .actions { display: flex; gap: 6px; }
  .icon-btn {
    width: 32px; height: 32px; display: grid; place-items: center; border-radius: 9px; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); transition: all .12s;
  }
  .icon-btn:hover { border-color: var(--ink); color: var(--ink); }
  .icon-btn.del:hover { border-color: var(--danger); color: var(--danger); }

  .row.upcoming { --st: var(--accent); --st-soft: var(--accent-soft); }
  .row.today    { --st: var(--today);  --st-soft: var(--today-soft); }
  .row.live     { --st: var(--live);   --st-soft: var(--live-soft); }
  .row.done     { --st: var(--done);   --st-soft: var(--done-soft); background: var(--surface-2); }
  .row.done .date-block, .row.done .info { opacity: .55; filter: grayscale(1); }
  .row.done .co { text-decoration: line-through; text-decoration-color: var(--line-strong); text-decoration-thickness: 1.5px; }

  .empty { text-align: center; padding: 48px 20px; border: 1px dashed var(--line-strong); border-radius: var(--radius); color: var(--ink-2); background: rgba(255,255,255,.6); }

  /* ---------- footer ---------- */
  footer { margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
  footer p { margin: 0; font-size: 12.5px; color: var(--muted); max-width: 520px; }
  footer .actions { gap: 8px; }

  /* ---------- modal ---------- */
  dialog {
    border: 1px solid var(--line); border-radius: 20px; padding: 0; width: min(560px, calc(100vw - 32px));
    background: var(--surface); color: var(--ink); box-shadow: 0 30px 80px -30px rgba(22,23,26,.45);
  }
  dialog::backdrop { background: rgba(236,236,230,.7); backdrop-filter: blur(6px); }
  dialog[open] { animation: pop .18s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } }
  .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 20px 24px; border-bottom: 1px solid var(--line); }
  .modal-head h2 { margin: 2px 0 0; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
  .modal-body { padding: 20px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .field { display: grid; gap: 6px; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
  .field label em { color: var(--today); font-style: normal; }
  .field input, .field select, .field textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface-2); outline: none; font-size: 14.5px;
    transition: border-color .12s, background .12s;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--ink); background: #fff; }
  .field textarea { resize: vertical; min-height: 70px; }
  .modal-foot { display: flex; justify-content: space-between; gap: 10px; padding: 16px 24px 20px; border-top: 1px solid var(--line); }
  .modal-foot .right { display: flex; gap: 8px; margin-left: auto; }

  .sync-body { padding: 20px 24px; display: grid; gap: 16px; }
  .sync-body p { margin: 0; color: var(--ink-2); font-size: 14px; }
  .sync-body a { color: var(--live); text-decoration: none; border-bottom: 1px solid currentColor; }
  .steps { margin: 0; padding: 0; list-style: none; counter-reset: step; display: grid; gap: 10px; }
  .steps li { counter-increment: step; display: grid; grid-template-columns: 26px 1fr; gap: 10px; font-size: 14px; color: var(--ink-2); }
  .steps li::before {
    content: counter(step, decimal-leading-zero); font-family: var(--mono); font-size: 11px; color: var(--ink);
    border: 1px solid var(--line); border-radius: 7px; height: 22px; display: grid; place-items: center; margin-top: 1px;
  }
  .steps b { color: var(--ink); font-weight: 600; }
  .sync-err { font-family: var(--mono); font-size: 12.5px; color: var(--danger); background: #f7e9e7; border-radius: 10px; padding: 8px 12px; }
  .sync-status { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); }
  .sync-status .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); margin-top: 6px; flex: none; animation: pulse 2.4s ease-in-out infinite; }
  .sync-status b { display: block; font-weight: 600; }
  .sync-status span { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  .pair { display: grid; grid-template-columns: 156px 1fr; gap: 18px; align-items: center; }
  .qr { width: 156px; height: 156px; padding: 4px; border: 1px solid var(--line); border-radius: 12px; display: grid; place-items: center; background: #fff; }
  .qr img, .qr canvas { display: block; width: 146px !important; height: 146px !important; }
  .copyrow { display: flex; gap: 8px; margin-top: 10px; }
  .copyrow input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; background: var(--surface-2); font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
  @media (max-width: 520px) { .pair { grid-template-columns: 1fr; justify-items: center; text-align: center; } }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0;
    background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-family: var(--mono); font-size: 12.5px;
    transition: all .25s ease; pointer-events: none; z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  /* shown as a popover so it sits above open dialogs */
  .toast[popover] { inset: auto; top: auto; right: auto; left: 50%; bottom: 24px; margin: 0; border: 0; overflow: visible; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- responsive ---------- */
  @media (max-width: 760px) {
    .wrap { padding: 0 16px 60px; }
    .hero { grid-template-columns: 1fr; padding: 22px; gap: 20px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .row { grid-template-columns: 60px 1fr; gap: 14px; }
    .side { grid-column: 1 / -1; flex-direction: row; align-items: center; justify-content: space-between; border-top: 1px dashed var(--line); padding-top: 10px; flex-wrap: wrap; }
    .seg { width: 100%; }
    .seg button { flex: 1; padding: 7px 6px; }
    .modal-body { grid-template-columns: 1fr; }
    .clock b { font-size: 15px; }
  }
  @media (max-width: 560px) {
    .clock { display: none; }
  }
  @media (max-width: 420px) {
    .brand small { display: none; }
    .countdown { gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark"><span></span></div>
      <div>
        <h1>Placement Console</h1>
        <small>Test schedule · v1</small>
      </div>
    </div>
    <div class="top-right">
      <button class="sync-pill" id="syncPill" title="Sync across devices"><i></i><span>Sync off</span></button>
      <div class="clock">
        <b id="clockTime">--:--:--</b>
        <span id="clockDate">—</span>
      </div>
    </div>
  </header>

  <section class="hero" id="hero" aria-live="polite"></section>

  <section class="stats" id="stats"></section>

  <div class="toolbar">
    <div class="seg" role="tablist" id="filters">
      <button data-f="upcoming" class="on">Upcoming<span class="n"></span></button>
      <button data-f="done">Completed<span class="n"></span></button>
      <button data-f="all">All<span class="n"></span></button>
    </div>
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="color:var(--muted)"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Search company, round, notes…" autocomplete="off">
    </label>
    <button class="btn" id="addBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      New test
    </button>
  </div>

  <main id="list"></main>

  <footer>
    <p id="footNote">Your schedule is saved on this device. Turn on <b>Sync</b> (top right) to keep your laptop and phone in step.</p>
    <div class="actions">
      <button class="btn ghost sm" id="exportBtn">Export backup</button>
      <button class="btn ghost sm" id="importBtn">Import</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </footer>
</div>

<!-- add / edit modal -->
<dialog id="modal">
  <form id="form" method="dialog" autocomplete="off">
    <div class="modal-head">
      <div>
        <div class="label" id="modalKicker">New entry</div>
        <h2 id="modalTitle">Schedule a test</h2>
      </div>
      <button type="button" class="icon-btn" id="closeBtn" aria-label="Close">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="field full">
        <label for="f-company">Company <em>*</em></label>
        <input id="f-company" name="company" required maxlength="80" placeholder="e.g. Infosys">
      </div>
      <div class="field full">
        <label for="f-test">Test / round <em>*</em></label>
        <input id="f-test" name="test" required maxlength="100" list="roundTypes" placeholder="e.g. Online Assessment">
        <datalist id="roundTypes">
          <option value="Online Assessment">
          <option value="Aptitude Test">
          <option value="Coding Round">
          <option value="Technical Interview">
          <option value="Group Discussion">
          <option value="HR Interview">
          <option value="Managerial Round">
          <option value="Pre-placement Talk">
        </datalist>
      </div>
      <div class="field">
        <label for="f-date">Date <em>*</em></label>
        <input id="f-date" name="date" type="date" required>
      </div>
      <div class="field">
        <label for="f-time">Time <em>*</em></label>
        <input id="f-time" name="time" type="time" required>
      </div>
      <div class="field">
        <label for="f-duration">Duration (min)</label>
        <input id="f-duration" name="duration" type="number" min="5" max="1440" step="5" placeholder="90">
      </div>
      <div class="field">
        <label for="f-platform">Platform / link</label>
        <input id="f-platform" name="platform" maxlength="300" placeholder="HackerRank, campus hall…">
      </div>
      <div class="field full">
        <label for="f-notes">Notes</label>
        <textarea id="f-notes" name="notes" maxlength="1000" placeholder="Syllabus, eligibility, things to bring…"></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn ghost" id="deleteBtn" hidden>Delete</button>
      <div class="right">
        <button type="button" class="btn ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn" id="saveBtn">Save test</button>
      </div>
    </div>
  </form>
</dialog>

<!-- confirm modal -->
<dialog id="confirm">
  <div class="modal-head">
    <div>
      <div class="label">Confirm</div>
      <h2 id="confirmTitle">Delete this test?</h2>
    </div>
  </div>
  <div class="modal-body" style="grid-template-columns:1fr"><p id="confirmText" style="margin:0;color:var(--ink-2)"></p></div>
  <div class="modal-foot">
    <div class="right">
      <button type="button" class="btn ghost" id="confirmNo">Cancel</button>
      <button type="button" class="btn danger" id="confirmYes">Delete</button>
    </div>
  </div>
</dialog>

<!-- sync modal (content rendered by script) -->
<dialog id="syncDlg"></dialog>

<div class="toast" id="toast" popover="manual"></div>

<script>
(() => {
  const KEY = "placement-console.tests.v1";
  const DEL_KEY = "placement-console.deleted.v1";   // id -> deletion time, so deletes sync too
  const SYNC_KEY = "placement-console.sync.v1";
  const GIST_FILE = "placement-console.json";
  const API = "https://api.github.com";
  const DEFAULT_DURATION = 90; // minutes, used to decide when a test counts as finished
  const $ = (s) => document.querySelector(s);

  // ---------- storage ----------
  function read(key, fallback) {
    try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
    catch { return fallback; }
  }
  function write(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); return true; }
    catch { return false; }
  }
  function persist() {
    if (!write(KEY, tests) || !write(DEL_KEY, deleted)) toast("Could not save — browser storage is unavailable");
  }
  function save() { persist(); scheduleSync(); }

  let tests = read(KEY, []);
  if (!Array.isArray(tests)) tests = [];
  let deleted = read(DEL_KEY, {});
  if (!deleted || typeof deleted !== "object") deleted = {};
  let filter = "upcoming";
  let query = "";
  let editingId = null;

  // ---------- helpers ----------
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pad = (n) => String(n).padStart(2, "0");
  const startOf = (t) => new Date(`${t.date}T${t.time || "00:00"}`);
  const endOf = (t) => new Date(startOf(t).getTime() + (Number(t.duration) || DEFAULT_DURATION) * 60000);
  const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();

  function statusOf(t, now = new Date()) {
    const s = startOf(t), e = endOf(t);
    if (now >= e) return "done";
    if (now >= s) return "live";
    if (sameDay(s, now)) return "today";
    return "upcoming";
  }
  const STATUS_LABEL = { upcoming: "Upcoming", today: "Today", live: "In progress", done: "Completed" };

  const fmtTime = (d) => d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const fmtDate = (d) => d.toLocaleDateString([], { weekday: "short", day: "numeric", month: "short", year: "numeric" });

  function eta(t, now = new Date()) {
    const st = statusOf(t, now);
    if (st === "done") {
      const e = endOf(t);
      const days = Math.round((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - new Date(e.getFullYear(), e.getMonth(), e.getDate())) / 86400000);
      return days <= 0 ? "Finished today" : days === 1 ? "Finished yesterday" : `Finished ${days}d ago`;
    }
    if (st === "live") {
      const left = Math.max(0, Math.round((endOf(t) - now) / 60000));
      return `Ends in ${left}m`;
    }
    let ms = startOf(t) - now;
    const d = Math.floor(ms / 86400000); ms -= d * 86400000;
    const h = Math.floor(ms / 3600000); ms -= h * 3600000;
    const m = Math.floor(ms / 60000);
    if (d > 0) return `T−${d}d ${pad(h)}h`;
    if (h > 0) return `T−${h}h ${pad(m)}m`;
    return `T−${Math.max(m, 0)}m`;
  }

  function linkify(text) {
    const safe = esc(text);
    return safe.replace(/(https?:\/\/[^\s<]+)/g, (u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u.replace(/^https?:\/\//, "").slice(0, 40)}${u.length > 48 ? "…" : ""}</a>`);
  }

  // ---------- render ----------
  function render() {
    const now = new Date();
    const withStatus = tests.map((t) => ({ ...t, _st: statusOf(t, now) }));
    const active = withStatus.filter((t) => t._st !== "done").sort((a, b) => startOf(a) - startOf(b));
    const done = withStatus.filter((t) => t._st === "done").sort((a, b) => startOf(b) - startOf(a));

    renderHero(active, now);
    renderStats(active, done, now);

    // filter counts
    const counts = { upcoming: active.length, done: done.length, all: tests.length };
    document.querySelectorAll("#filters button").forEach((b) => {
      b.classList.toggle("on", b.dataset.f === filter);
      b.querySelector(".n").textContent = counts[b.dataset.f];
    });

    let rows = filter === "upcoming" ? active : filter === "done" ? done : [...active, ...done];
    if (query) {
      const q = query.toLowerCase();
      rows = rows.filter((t) => [t.company, t.test, t.platform, t.notes].some((v) => String(v || "").toLowerCase().includes(q)));
    }

    const list = $("#list");
    if (!rows.length) {
      const msg = query ? `Nothing matches “${esc(query)}”.`
        : filter === "done" ? "No completed tests yet. Finished tests move here automatically."
        : tests.length ? "No upcoming tests. Time to apply to more companies."
        : "Your schedule is empty. Add your first test to get started.";
      list.innerHTML = `<div class="empty"><div class="label" style="margin-bottom:6px">Nothing here</div>${msg}</div>`;
      return;
    }

    // group by time bucket
    const groups = [];
    const push = (name, t) => { let g = groups.find((x) => x.name === name); if (!g) groups.push(g = { name, items: [] }); g.items.push(t); };
    const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    rows.forEach((t) => {
      if (t._st === "done") return push("Completed", t);
      const days = Math.floor((startOf(t) - startToday) / 86400000);
      if (days <= 0) push("Today", t);
      else if (days === 1) push("Tomorrow", t);
      else if (days < 7) push("This week", t);
      else if (days < 30) push("This month", t);
      else push("Later", t);
    });

    list.innerHTML = groups.map((g) => `
      <div class="group-label"><span class="label">${g.name} · ${g.items.length}</span></div>
      <div class="list">${g.items.map((t, i) => rowHTML(t, now, i)).join("")}</div>
    `).join("");
  }

  function rowHTML(t, now, i) {
    const s = startOf(t);
    return `
      <article class="row ${t._st}" style="animation-delay:${Math.min(i, 8) * 30}ms">
        <div class="date-block">
          <div class="d">${pad(s.getDate())}</div>
          <div class="m">${s.toLocaleDateString([], { month: "short" })}</div>
          <div class="w">${s.toLocaleDateString([], { weekday: "short" })}</div>
        </div>
        <div class="info">
          <div class="co">${esc(t.company)}</div>
          <div class="tt">${esc(t.test)}</div>
          <div class="meta">
            <span class="chip">${fmtTime(s)}${t.duration ? ` · ${t.duration}m` : ""}</span>
            ${t.platform ? `<span class="chip">${linkify(t.platform)}</span>` : ""}          </div>
          ${t.notes ? `<div class="notes">${linkify(t.notes)}</div>` : ""}
        </div>
        <div class="side">
          <span class="status"><span class="dot"></span>${STATUS_LABEL[t._st]}</span>
          <span class="eta">${eta(t, now)}</span>
          <div class="actions">
            <button class="icon-btn" data-edit="${t.id}" aria-label="Edit ${esc(t.company)}" title="Edit">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/></svg>
            </button>
            <button class="icon-btn del" data-del="${t.id}" aria-label="Delete ${esc(t.company)}" title="Delete">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
            </button>
          </div>
        </div>
      </article>`;
  }

  let heroTarget = null;
  function renderHero(active, now) {
    const hero = $("#hero");
    const next = active[0];
    heroTarget = next || null;
    if (!next) {
      hero.innerHTML = `
        <div class="hero-empty">
          <div class="label">Next test</div>
          <div class="hero-company" style="font-size:28px">All clear</div>
          <p>${tests.length ? "No tests coming up. Everything on your list is done." : "Add the tests you've been shortlisted for, and the next one will show up here with a live countdown."}</p>
          <button class="btn" data-action="add">+ Add a test</button>
        </div>`;
      return;
    }
    const s = startOf(next);
    const st = next._st;
    hero.innerHTML = `
      <div>
        <div class="label">${st === "live" ? "Happening now" : "Next test"}</div>
        <div class="hero-company">${esc(next.company)}</div>
        <div class="hero-test">${esc(next.test)}</div>
        <div class="hero-meta">
          <span class="chip">${fmtDate(s)}</span>
          <span class="chip">${fmtTime(s)}</span>
          ${next.platform ? `<span class="chip">${linkify(next.platform)}</span>` : ""}
          <button class="chip" style="cursor:pointer" data-edit="${next.id}">Edit</button>
        </div>
      </div>
      <div class="countdown" id="countdown">
        ${["Days", "Hrs", "Min", "Sec"].map((u) => `<div class="cd-cell"><b>00</b><span>${u}</span></div>`).join("")}
      </div>`;
    tickHero(now);
  }

  function tickHero(now = new Date()) {
    const cd = $("#countdown");
    if (!cd || !heroTarget) return;
    const target = statusOf(heroTarget, now) === "live" ? endOf(heroTarget) : startOf(heroTarget);
    let ms = Math.max(0, target - now);
    const d = Math.floor(ms / 86400000); ms -= d * 86400000;
    const h = Math.floor(ms / 3600000); ms -= h * 3600000;
    const m = Math.floor(ms / 60000); ms -= m * 60000;
    const sec = Math.floor(ms / 1000);
    const cells = cd.querySelectorAll("b");
    [d, h, m, sec].forEach((v, i) => { cells[i].textContent = pad(v); });
  }

  function renderStats(active, done, now) {
    const weekEnd = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 7);
    const thisWeek = active.filter((t) => startOf(t) < weekEnd).length;
    const today = active.filter((t) => sameDay(startOf(t), now)).length;
    $("#stats").innerHTML = [
      ["Upcoming", active.length, "var(--accent)"],
      ["Today", today, "var(--today)"],
      ["Next 7 days", thisWeek, "var(--live)"],
      ["Completed", done.length, "var(--done)"],
    ].map(([k, v, c]) => `<div class="stat"><span class="label"><i style="background:${c}"></i>${k}</span><b>${pad(v)}</b></div>`).join("");
  }

  // ---------- modal ----------
  const modal = $("#modal"), form = $("#form");
  function openModal(id = null) {
    editingId = id;
    form.reset();
    const t = id ? tests.find((x) => x.id === id) : null;
    $("#modalKicker").textContent = t ? "Update entry" : "New entry";
    $("#modalTitle").textContent = t ? `Edit ${t.company}` : "Schedule a test";
    $("#saveBtn").textContent = t ? "Save changes" : "Save test";
    $("#deleteBtn").hidden = !t;
    if (t) {
      form.company.value = t.company;
      form.test.value = t.test;
      form.date.value = t.date;
      form.time.value = t.time;
      form.duration.value = t.duration || "";
      form.platform.value = t.platform || "";
      form.notes.value = t.notes || "";
    } else {
      const tomorrow = new Date(Date.now() + 86400000);
      form.date.value = `${tomorrow.getFullYear()}-${pad(tomorrow.getMonth() + 1)}-${pad(tomorrow.getDate())}`;
      form.time.value = "10:00";
    }
    modal.showModal();
    setTimeout(() => form.company.focus(), 30);
  }
  const closeModal = () => { modal.close(); editingId = null; render(); };

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const v = Object.fromEntries(new FormData(form));
    const entry = {
      company: v.company.trim(),
      test: v.test.trim(),
      date: v.date,
      time: v.time,
      duration: v.duration ? Math.max(5, Math.min(1440, Number(v.duration))) : null,
      platform: v.platform.trim(),
      notes: v.notes.trim(),
    };
    if (!entry.company || !entry.test || !entry.date || !entry.time) return;

    if (editingId) {
      const t = tests.find((x) => x.id === editingId);
      if (t) {
        Object.assign(t, entry, { updatedAt: new Date().toISOString() });
        delete t.history; // old slots aren't kept; an edit simply replaces the test
        toast(`${entry.company} updated`);
      }
    } else {
      const ts = new Date().toISOString();
      tests.push({ id: uid(), ...entry, createdAt: ts, updatedAt: ts });
      toast(`${entry.company} added`);
      if (statusOf(entry) === "done") filter = "all";
    }
    save();
    closeModal();
  });

  // ---------- delete with confirm ----------
  const confirmDlg = $("#confirm");
  let pendingDelete = null;
  function askDelete(id) {
    const t = tests.find((x) => x.id === id);
    if (!t) return;
    pendingDelete = id;
    $("#confirmTitle").textContent = `Delete ${t.company}?`;
    $("#confirmText").textContent = `${t.test} on ${fmtDate(startOf(t))} will be removed from your schedule. This can't be undone.`;
    confirmDlg.showModal();
  }
  $("#confirmNo").onclick = () => { confirmDlg.close(); pendingDelete = null; if (!modal.open) render(); };
  $("#confirmYes").onclick = () => {
    const t = tests.find((x) => x.id === pendingDelete);
    tests = tests.filter((x) => x.id !== pendingDelete);
    deleted[pendingDelete] = new Date().toISOString();
    save();
    confirmDlg.close();
    if (modal.open) closeModal();
    pendingDelete = null;
    render();
    if (t) toast(`${t.company} deleted`);
  };

  // ---------- events ----------
  $("#addBtn").onclick = () => openModal();
  $("#closeBtn").onclick = closeModal;
  $("#cancelBtn").onclick = closeModal;
  $("#deleteBtn").onclick = () => editingId && askDelete(editingId);
  modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });

  document.addEventListener("click", (e) => {
    const ed = e.target.closest("[data-edit]");
    if (ed) return openModal(ed.dataset.edit);
    const del = e.target.closest("[data-del]");
    if (del) return askDelete(del.dataset.del);
    if (e.target.closest("[data-action=add]")) return openModal();
  });

  $("#filters").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    filter = b.dataset.f;
    render();
  });
  $("#search").addEventListener("input", (e) => { query = e.target.value.trim(); render(); });

  document.addEventListener("keydown", (e) => {
    if (e.key.toLowerCase() === "n" && !e.ctrlKey && !e.metaKey && !e.altKey && !modal.open && !confirmDlg.open && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) {
      e.preventDefault(); openModal();
    }
  });

  // ---------- backup ----------
  $("#exportBtn").onclick = () => {
    const blob = new Blob([JSON.stringify({ app: "placement-console", version: 1, exportedAt: new Date().toISOString(), tests }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    const d = new Date();
    a.href = URL.createObjectURL(blob);
    a.download = `placement-schedule-${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast(`Exported ${tests.length} test${tests.length === 1 ? "" : "s"}`);
  };
  $("#importBtn").onclick = () => $("#importFile").click();
  $("#importFile").onchange = async (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      const incoming = Array.isArray(data) ? data : data.tests;
      if (!Array.isArray(incoming)) throw new Error();
      const valid = incoming.filter((t) => t && t.company && t.test && /^\d{4}-\d{2}-\d{2}$/.test(t.date) && /^\d{2}:\d{2}/.test(t.time));
      // merge: imported entries replace ones with the same id, everything else is added
      const byId = new Map(tests.map((t) => [t.id, t]));
      const ts = new Date().toISOString();
      valid.forEach((t) => {
        const id = t.id || uid();
        byId.set(id, { ...t, id, updatedAt: ts });
        delete deleted[id];
      });
      tests = [...byId.values()];
      save(); render();
      toast(`Imported ${valid.length} test${valid.length === 1 ? "" : "s"}`);
    } catch {
      toast("That file doesn't look like a schedule backup");
    }
  };

  // ---------- cross-device sync ----------
  // The schedule is mirrored to a secret Gist on the user's own GitHub account.
  // Every device keeps a full local copy; a sync pulls the Gist, merges it with
  // local data (newest edit per test wins, deletions are remembered), saves the
  // result locally and pushes it back if anything changed.
  let syncCfg = read(SYNC_KEY, {}) || {};   // { token, login, gistId, lastSync }
  const saveSyncCfg = () => write(SYNC_KEY, syncCfg);
  let syncState = syncCfg.token ? "busy" : "off";
  let syncError = "";
  let syncInFlight = null, syncAgain = false, syncTimer = null;

  const stamp = (t) => t.updatedAt || t.createdAt || "";
  const canon = (d) => JSON.stringify({
    tests: [...(d.tests || [])].sort((a, b) => (a.id < b.id ? -1 : 1)),
    deleted: Object.fromEntries(Object.entries(d.deleted || {}).sort()),
  });

  function mergeData(remote) {
    const del = { ...(remote.deleted || {}) };
    for (const [id, ts] of Object.entries(deleted)) if (!del[id] || ts > del[id]) del[id] = ts;
    const cutoff = new Date(Date.now() - 120 * 86400000).toISOString();
    for (const id of Object.keys(del)) if (del[id] < cutoff) delete del[id];
    const byId = new Map();
    for (const t of [...(remote.tests || []), ...tests]) {
      if (!t || !t.id) continue;
      const cur = byId.get(t.id);
      if (!cur || stamp(t) > stamp(cur)) byId.set(t.id, t);
    }
    return { tests: [...byId.values()].filter((t) => !(del[t.id] && del[t.id] >= stamp(t))), deleted: del };
  }

  async function gh(path, opts = {}, token = syncCfg.token) {
    const res = await fetch(API + path, {
      cache: "no-store",
      ...opts,
      headers: {
        Accept: "application/vnd.github+json",
        Authorization: `Bearer ${token}`,
        ...(opts.body ? { "Content-Type": "application/json" } : {}),
      },
    });
    if (!res.ok) { const err = new Error(`GitHub responded ${res.status}`); err.status = res.status; throw err; }
    return res;
  }

  async function findGist() {
    for (let page = 1; page <= 10; page++) {
      const list = await (await gh(`/gists?per_page=100&page=${page}`)).json();
      const hit = list.find((g) => g.files && g.files[GIST_FILE]);
      if (hit) return (await gh(`/gists/${hit.id}`)).json();
      if (list.length < 100) break;
    }
    return null;
  }

  async function remoteData(gist) {
    const empty = { tests: [], deleted: {} };
    const f = gist && gist.files && gist.files[GIST_FILE];
    if (!f) return empty;
    try {
      const text = f.truncated ? await (await fetch(f.raw_url, { cache: "no-store" })).text() : f.content;
      const d = JSON.parse(text);
      return { tests: Array.isArray(d.tests) ? d.tests : [], deleted: d.deleted && typeof d.deleted === "object" ? d.deleted : {} };
    } catch { return empty; }
  }

  const payload = () => JSON.stringify({ app: "placement-console", version: 2, savedAt: new Date().toISOString(), tests, deleted }, null, 2);

  function syncNow() {
    if (!syncCfg.token) return Promise.resolve();
    if (syncInFlight) { syncAgain = true; return syncInFlight; }
    setSyncState("busy");
    syncInFlight = (async () => {
      try {
        let gist = null;
        if (syncCfg.gistId) {
          try { gist = await (await gh(`/gists/${syncCfg.gistId}`)).json(); }
          catch (e) { if (e.status !== 404) throw e; }
        }
        if (!gist) gist = await findGist();
        const remote = await remoteData(gist);
        const before = canon({ tests, deleted });
        const merged = mergeData(remote);
        tests = merged.tests;
        deleted = merged.deleted;
        persist();
        const files = { [GIST_FILE]: { content: payload() } };
        if (!gist) {
          gist = await (await gh("/gists", { method: "POST", body: JSON.stringify({ description: "Placement Console — synced test schedule", public: false, files }) })).json();
        } else if (canon(merged) !== canon(remote)) {
          await gh(`/gists/${gist.id}`, { method: "PATCH", body: JSON.stringify({ files }) });
        }
        syncCfg.gistId = gist.id;
        syncCfg.lastSync = new Date().toISOString();
        saveSyncCfg();
        if (canon(merged) !== before && !modal.open && !confirmDlg.open) render();
        setSyncState("ok");
      } catch (e) {
        if (e.status === 401) setSyncState("auth", "GitHub rejected the key — it may have expired or been deleted. Paste a new one to reconnect.");
        else if (navigator.onLine === false) setSyncState("offline");
        else setSyncState("error", e.message || "Couldn't reach GitHub.");
      } finally {
        syncInFlight = null;
        if (syncAgain) { syncAgain = false; syncNow(); }
      }
    })();
    return syncInFlight;
  }

  function scheduleSync() {
    if (!syncCfg.token) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(syncNow, 500);
  }

  async function connect(token) {
    token = token.trim();
    const res = await gh("/user", {}, token);
    const scopes = res.headers.get("X-OAuth-Scopes");
    if (scopes !== null && !/\bgist\b/.test(scopes)) {
      const err = new Error("This key doesn't have the “gist” permission. Create a new one with the gist box ticked.");
      err.status = "scope";
      throw err;
    }
    const user = await res.json();
    syncCfg = { token, login: user.login };
    saveSyncCfg();
    await syncNow();
    if (syncState !== "ok") throw new Error(syncError || "Connected, but the first sync failed.");
  }

  function disconnect() {
    clearTimeout(syncTimer);
    syncCfg = {};
    try { localStorage.removeItem(SYNC_KEY); } catch {}
    setSyncState("off");
    toast("Sync turned off on this device");
  }

  const SYNC_PILL = {
    off:     ["", "Sync off"],
    busy:    ["busy", "Syncing…"],
    ok:      ["ok", "Synced"],
    offline: ["warn", "Offline"],
    auth:    ["bad", "Reconnect"],
    error:   ["warn", "Sync error"],
  };
  function setSyncState(state, err = "") {
    syncState = state;
    syncError = err;
    const [cls, text] = SYNC_PILL[state];
    const pill = $("#syncPill");
    pill.className = `sync-pill ${cls}`;
    pill.querySelector("span").textContent = text;
    pill.title = state === "ok" && syncCfg.lastSync ? `Last synced ${fmtTime(new Date(syncCfg.lastSync))}` : "Sync across devices";
    $("#footNote").innerHTML = syncCfg.token
      ? `Synced to a private Gist on <b>@${esc(syncCfg.login || "your account")}</b>. Changes made on your laptop or phone show up on the other within a minute.`
      : `Your schedule is saved on this device. Turn on <b>Sync</b> (top right) to keep your laptop and phone in step.`;
    if (syncDlg.open && !syncDlg.contains(document.activeElement)) renderSyncDialog();
    else if (syncDlg.open) updateSyncStatusLine();
  }

  // ---------- sync dialog ----------
  const syncDlg = $("#syncDlg");
  const TOKEN_URL = "https://github.com/settings/tokens/new?scopes=gist&description=Placement%20Console%20sync";
  const pairLink = () => `${location.origin}${location.pathname}#sync=${encodeURIComponent(syncCfg.token)}`;

  function statusLine() {
    if (syncState === "busy") return "Syncing now…";
    if (syncState === "offline") return "You're offline — changes are saved here and will sync when you're back online.";
    if (syncState === "error") return `Last attempt failed: ${syncError}`;
    return syncCfg.lastSync ? `Last synced ${fmtTime(new Date(syncCfg.lastSync))} · checks every minute and whenever you open the page` : "Not synced yet";
  }
  function updateSyncStatusLine() {
    const el = syncDlg.querySelector("[data-status]");
    if (el) el.textContent = statusLine();
  }

  function renderSyncDialog() {
    const connected = syncCfg.token && syncState !== "auth";
    const head = `
      <div class="modal-head">
        <div><div class="label">Sync</div><h2>${connected ? "Your devices are linked" : "Sync laptop &amp; phone"}</h2></div>
        <button type="button" class="icon-btn" data-sync="close" aria-label="Close">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>`;
    if (!connected) {
      syncDlg.innerHTML = `${head}
        <form class="sync-body" data-sync-form>
          <p>Your tests get saved to a private Gist (a small file) on your own GitHub account, and every device you connect reads and writes that same file. You only set this up once.</p>
          <ol class="steps">
            <li><span><a href="${TOKEN_URL}" target="_blank" rel="noopener">Create a GitHub key ↗</a>. Only the <b>gist</b> box needs to be ticked, and it already is. Set the expiry to <b>No expiration</b> or a date after placements, then press <b>Generate token</b> and copy it.</span></li>
            <li><span>Paste the key below and press <b>Connect</b>.</span></li>
            <li><span>A QR code will appear. Scan it with your phone camera and the phone connects too.</span></li>
          </ol>
          <div class="field">
            <label for="tokenInput">GitHub key</label>
            <input id="tokenInput" type="password" placeholder="ghp_…" autocomplete="off" spellcheck="false" required>
          </div>
          ${syncError ? `<div class="sync-err">${esc(syncError)}</div>` : ""}
        </form>
        <div class="modal-foot">
          ${syncCfg.token ? `<button type="button" class="btn ghost" data-sync="disconnect">Turn off sync</button>` : ""}
          <div class="right">
            <button type="button" class="btn ghost" data-sync="close">Cancel</button>
            <button type="button" class="btn" data-sync="connect">Connect</button>
          </div>
        </div>`;
      return;
    }
    syncDlg.innerHTML = `${head}
      <div class="sync-body">
        <div class="sync-status"><span class="dot"></span><div><b>Connected as @${esc(syncCfg.login || "you")}</b><span data-status>${esc(statusLine())}</span></div></div>
        <div class="pair">
          <div class="qr" id="qr" aria-label="QR code for linking your phone"></div>
          <div>
            <div class="label">Link another device</div>
            <p style="margin-top:6px">Scan this with your phone camera, or open the link below on it. It has your key inside, so don't share it with anyone.</p>
            <div class="copyrow">
              <input readonly value="${esc(pairLink())}" aria-label="Device link" data-pair>
              <button type="button" class="btn ghost sm" data-sync="copy">Copy</button>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn ghost" data-sync="disconnect">Turn off sync</button>
        <div class="right">
          ${syncCfg.gistId ? `<a class="btn ghost" href="https://gist.github.com/${esc(syncCfg.login || "")}/${esc(syncCfg.gistId)}" target="_blank" rel="noopener" style="text-decoration:none">View data</a>` : ""}
          <button type="button" class="btn" data-sync="now">Sync now</button>
        </div>
      </div>`;
    drawQR($("#qr"), pairLink());
  }

  let qrLib = null;
  function drawQR(el, text) {
    if (!el) return;
    qrLib = qrLib || new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
      s.onload = () => resolve(window.QRCode);
      s.onerror = () => { qrLib = null; reject(); };
      document.head.appendChild(s);
    });
    qrLib.then((QR) => {
      el.innerHTML = "";
      new QR(el, { text, width: 146, height: 146, colorDark: "#16171a", colorLight: "#ffffff", correctLevel: QR.CorrectLevel.M });
    }).catch(() => { el.innerHTML = `<span class="label" style="text-align:center">QR unavailable<br>use the link</span>`; });
  }

  function openSync() {
    renderSyncDialog();
    if (!syncDlg.open) syncDlg.showModal();
    const input = syncDlg.querySelector("#tokenInput");
    if (input) setTimeout(() => input.focus(), 30);
  }

  async function doConnect() {
    const input = syncDlg.querySelector("#tokenInput");
    const btn = syncDlg.querySelector("[data-sync=connect]");
    if (!input || !input.value.trim()) { input && input.focus(); return; }
    btn.disabled = true;
    btn.textContent = "Connecting…";
    try {
      await connect(input.value);
      syncError = "";
      renderSyncDialog();
      toast("Sync is on");
    } catch (e) {
      syncError = e.status === 401 ? "GitHub didn't accept that key. Check you copied all of it." : e.message || "Couldn't connect.";
      if (!syncCfg.login) { syncCfg = {}; try { localStorage.removeItem(SYNC_KEY); } catch {} syncState = "off"; }
      renderSyncDialog();
      setSyncState(syncState, syncError);
    }
  }

  $("#syncPill").onclick = openSync;
  syncDlg.addEventListener("click", async (e) => {
    if (e.target === syncDlg) return syncDlg.close();
    const act = e.target.closest("[data-sync]")?.dataset.sync;
    if (act === "close") syncDlg.close();
    else if (act === "connect") doConnect();
    else if (act === "now") syncNow();
    else if (act === "disconnect") { disconnect(); renderSyncDialog(); }
    else if (act === "copy") {
      const field = syncDlg.querySelector("[data-pair]");
      try { await navigator.clipboard.writeText(field.value); toast("Link copied — open it on your phone"); }
      catch { field.select(); toast("Press Ctrl+C to copy"); }
    }
  });
  syncDlg.addEventListener("submit", (e) => { e.preventDefault(); doConnect(); });
  syncDlg.addEventListener("close", () => { if (syncState === "off" || syncState === "ok") syncError = ""; });

  // pull fresh data whenever the page comes back into view, and once a minute while visible
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") syncNow(); });
  window.addEventListener("online", () => syncNow());
  setInterval(() => { if (document.visibilityState === "visible") syncNow(); }, 60000);

  // ---------- toast ----------
  let toastTimer;
  function toast(msg) {
    const el = $("#toast");
    el.textContent = msg;
    if (el.showPopover) {
      // re-open so it lands on top of whichever dialog is currently open
      try { if (el.matches(":popover-open")) el.hidePopover(); el.showPopover(); } catch {}
    }
    requestAnimationFrame(() => el.classList.add("show"));
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
  }

  // ---------- clock + live updates ----------
  let lastMinute = -1;
  function tick() {
    const now = new Date();
    $("#clockTime").textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    $("#clockDate").textContent = now.toLocaleDateString([], { weekday: "long", day: "numeric", month: "short" });
    tickHero(now);
    // re-render once a minute so statuses and colours flip on their own
    if (now.getMinutes() !== lastMinute) {
      if (lastMinute !== -1 && !modal.open) render();
      lastMinute = now.getMinutes();
    }
  }

  render();
  tick();
  setInterval(tick, 1000);

  // a device link looks like …/#sync=<key>; take the key and scrub it from the address bar
  const linkToken = new URLSearchParams(location.hash.slice(1)).get("sync");
  if (linkToken) {
    history.replaceState(null, "", location.pathname + location.search);
    setSyncState("busy");
    connect(linkToken)
      .then(() => toast("This device is now synced"))
      .catch((e) => {
        if (!syncCfg.login) { syncCfg = {}; try { localStorage.removeItem(SYNC_KEY); } catch {} }
        setSyncState(syncCfg.token ? syncState : "off", e.status === 401 ? "That link's key was rejected by GitHub. Paste a fresh key here." : e.message);
        openSync();
      });
  } else {
    setSyncState(syncState);
    syncNow();
  }
})();
</script>
</body>
</html>
